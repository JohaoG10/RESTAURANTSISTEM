name: Publicar imagen Docker

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar contenedor
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/johaog10/restaurantsistem:latest
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
